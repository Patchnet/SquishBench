&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;stress-reliever&#x27;);
  if (!root || root.dataset.ready === &#x27;true&#x27;) return;
  root.dataset.ready = &#x27;true&#x27;;

  const stage = document.getElementById(&#x27;sr-stage&#x27;);
  const orbit = document.getElementById(&#x27;sr-orbit&#x27;);
  const squishy = document.getElementById(&#x27;sr-squishy&#x27;);
  const status = document.getElementById(&#x27;sr-status&#x27;);
  const readout = document.getElementById(&#x27;sr-readout&#x27;);
  const buttons = Array.from(root.querySelectorAll(&#x27;button[data-kind]&#x27;));
  const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;

  const state = {
    kind: &#x27;ball&#x27;,
    pointerX: 0.78,
    pointerY: 0.52,
    objectX: 0.50,
    objectY: 0.52,
    grabbing: false,
    throwing: false,
    caughtBy: null,
    startDistance: 1,
    lastAngle: 0,
    tossTarget: &#x27;right&#x27;,
    idleStart: performance.now()
  };

  const labels = { ball: &#x27;Ball&#x27;, cow: &#x27;Cow&#x27;, pizza: &#x27;Pizza&#x27; };
  const clamp = (value, min, max) =&gt; Math.min(max, Math.max(min, value));

  function stagePoint(event) {
    const rect = stage.getBoundingClientRect();
    return {
      x: clamp((event.clientX - rect.left) / rect.width, 0.03, 0.97),
      y: clamp((event.clientY - rect.top) / rect.height, 0.06, 0.94),
      width: rect.width,
      height: rect.height
    };
  }

  function leftPoint() {
    return { x: stage.clientWidth &lt;= 520 ? 0.12 : 0.16, y: 0.52 };
  }

  function setPointer(point) {
    state.pointerX = point.x;
    state.pointerY = point.y;
    root.style.setProperty(&#x27;--sr-right-x&#x27;, `${point.x * 100}%`);
    root.style.setProperty(&#x27;--sr-right-y&#x27;, `${point.y * 100}%`);
  }

  function setObject(x, y) {
    state.objectX = x;
    state.objectY = y;
    root.style.setProperty(&#x27;--sr-x&#x27;, `${x * 100}%`);
    root.style.setProperty(&#x27;--sr-y&#x27;, `${y * 100}%`);
  }

  function relaxedTransform() {
    squishy.style.transform = &#x27;rotate(0deg) scaleX(1) scaleY(1) skewY(0deg)&#x27;;
  }

  function updateGrip() {
    const left = leftPoint();
    const dx = (state.pointerX - left.x) * stage.clientWidth;
    const dy = (state.pointerY - left.y) * stage.clientHeight;
    const distance = Math.max(20, Math.hypot(dx, dy));
    const ratio = clamp(distance / state.startDistance, 0.48, 1.85);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const side = clamp(dy / 170, -1, 1);
    const scaleX = ratio;
    const scaleY = clamp(1.18 - (ratio - 0.5) * 0.34, 0.68, 1.22);
    const twist = side * 19;

    state.lastAngle = angle;
    setObject((left.x + state.pointerX) / 2, (left.y + state.pointerY) / 2);
    squishy.style.transform = `rotate(${angle}deg) scaleX(${scaleX}) scaleY(${scaleY}) skewY(${twist}deg)`;

    let action = &#x27;relaxed&#x27;;
    if (ratio &gt; 1.13) action = &#x27;stretched&#x27;;
    else if (ratio &lt; 0.86) action = &#x27;squished&#x27;;
    if (Math.abs(side) &gt; 0.35) action = `${action} + twisted`;
    status.textContent = action.charAt(0).toUpperCase() + action.slice(1);
    readout.textContent = `${labels[state.kind]} · ${action}`;
  }

  function wobble() {
    if (reducedMotion) {
      relaxedTransform();
      return;
    }
    squishy.animate([
      { transform: squishy.style.transform || &#x27;scale(1)&#x27; },
      { transform: `rotate(${state.lastAngle * 0.18}deg) scaleX(.88) scaleY(1.13) skewY(-6deg)` },
      { transform: &#x27;rotate(-3deg) scaleX(1.08) scaleY(.94) skewY(4deg)&#x27; },
      { transform: &#x27;rotate(2deg) scaleX(.97) scaleY(1.04) skewY(-2deg)&#x27; },
      { transform: &#x27;rotate(0deg) scaleX(1) scaleY(1) skewY(0deg)&#x27; }
    ], { duration: 560, easing: &#x27;cubic-bezier(.2,.8,.2,1)&#x27; }).onfinish = relaxedTransform;
  }

  function release() {
    if (!state.grabbing) return;
    state.grabbing = false;
    state.caughtBy = null;
    root.classList.remove(&#x27;is-grabbing&#x27;);
    status.textContent = &#x27;Wobbling&#x27;;
    readout.textContent = `${labels[state.kind]} · released`;
    wobble();
    window.setTimeout(() =&gt; {
      if (!state.grabbing &amp;&amp; !state.throwing) status.textContent = &#x27;Floating&#x27;;
    }, 580);
  }

  function startGrab(event) {
    if (event.button !== 0 || state.throwing) return;
    event.preventDefault();
    const point = stagePoint(event);
    setPointer(point);
    const left = leftPoint();
    state.startDistance = Math.max(80, Math.hypot(
      (point.x - left.x) * point.width,
      (point.y - left.y) * point.height
    ));
    state.grabbing = true;
    state.caughtBy = &#x27;right&#x27;;
    root.classList.add(&#x27;is-grabbing&#x27;);
    squishy.setPointerCapture(event.pointerId);
    status.textContent = &#x27;Gripped&#x27;;
    updateGrip();
  }

  function toss() {
    if (state.throwing) return;
    state.throwing = true;
    state.grabbing = false;
    root.classList.remove(&#x27;is-grabbing&#x27;);

    const left = leftPoint();
    const targetSide = state.tossTarget;
    const target = targetSide === &#x27;right&#x27;
      ? { x: state.pointerX - 0.055, y: state.pointerY }
      : { x: left.x + 0.06, y: left.y };
    const start = { x: state.objectX, y: state.objectY };
    const mid = {
      x: (start.x + target.x) / 2,
      y: clamp(Math.min(start.y, target.y) - 0.28, 0.16, 0.54)
    };
    const duration = reducedMotion ? 1 : 620;

    status.textContent = `Tossing ${targetSide}`;
    readout.textContent = `${labels[state.kind]} · airborne`;

    const animation = orbit.animate([
      { left: `${start.x * 100}%`, top: `${start.y * 100}%`, offset: 0 },
      { left: `${mid.x * 100}%`, top: `${mid.y * 100}%`, offset: .5 },
      { left: `${target.x * 100}%`, top: `${target.y * 100}%`, offset: 1 }
    ], { duration, easing: &#x27;cubic-bezier(.25,.75,.2,1)&#x27; });

    squishy.animate([
      { transform: &#x27;rotate(0deg) scale(1)&#x27; },
      { transform: &#x27;rotate(190deg) scaleX(1.12) scaleY(.9)&#x27; },
      { transform: &#x27;rotate(380deg) scale(1)&#x27; }

    animation.onfinish = () =&gt; {
      setObject(target.x, target.y);
      state.caughtBy = targetSide;
      state.tossTarget = targetSide === &#x27;right&#x27; ? &#x27;left&#x27; : &#x27;right&#x27;;
      state.throwing = false;

      readout.textContent = `${labels[state.kind]} · caught by ${targetSide} hand`;

  stage.addEventListener(&#x27;pointermove&#x27;, (event) =&gt; {
    const point = stagePoint(event);

  squishy.addEventListener(&#x27;pointerup&#x27;, release);
  squishy.addEventListener(&#x27;pointercancel&#x27;, release);

  stage.addEventListener(&#x27;contextmenu&#x27;, (event) =&gt; {
    event.preventDefault();
    toss();
  });

  buttons.forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const kind = button.dataset.kind;
      if (!kind) return;
      state.kind = kind;
      squishy.dataset.kind = kind;
      buttons.forEach((candidate) =&gt; {

  });

  function idleFrame(now) {
    if (!state.grabbing &amp;&amp; !state.throwing &amp;&amp; !state.caughtBy) {
      const t = (now - state.idleStart) / 1000;
      const x = 0.50 + Math.sin(t * 0.7) * 0.018;
      const y = 0.50 + Math.cos(t * 1.05) * 0.027;
      setObject(x, y);
      squishy.style.transform = `rotate(${Math.sin(t * .8) * 2.4}deg) scaleX(${1 + Math.sin(t * 1.4) * .018}) scaleY(${1 - Math.sin(t * 1.4) * .018})`;
    }
    requestAnimationFrame(idleFrame);
  }

  setPointer({ x: state.pointerX, y: state.pointerY });
  setObject(state.objectX, state.objectY);
  requestAnimationFrame(idleFrame);
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
